[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evalint"
version = "0.1.0"
description = "A linter for agent evaluations: audit the measurement system around a score."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yuriy" }]
keywords = ["agents", "evaluation", "benchmarks", "linting", "llm"]
dependencies = [
  "typer>=0.9",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
evalint = "evalint.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
